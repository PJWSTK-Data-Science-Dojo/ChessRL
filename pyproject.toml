[project]
name = "chessrl"
version = "0.3.0"
description = "Model-based reinforcement-learning chess engine with Gumbel MuZero search"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.24,<3.0",
    "torch>=2.13,<2.14",
    "python-chess>=1.9.0",
    "PyYAML>=6.0",
    "flask>=3.0.0",
    "flask-limiter>=4.1,<5",
    "loguru>=0.7.0",
    "tyro>=0.8.0",
    "tqdm>=4.66.0",
    "wandb>=0.16.0",
    "tensorboard>=2.14.0",
    "torch-tb-profiler>=0.4.3",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest>=9.0.3",
    "types-PyYAML",
    "types-tqdm",
]
perf = [
    "numba",
]
web = [
    "gunicorn>=23,<24",
]

[project.scripts]
luna-lichess-config = "luna.lichess_config:main"
luna-uci = "luna.uci:main"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "ANN", # flake8-annotations
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM108", # ternary operator
]

[tool.ruff.lint.isort]
known-first-party = ["luna"]

[tool.ruff.lint.per-file-ignores]
"src/luna/__init__.py" = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luna"]
