services:
  luna-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-5000}:5000"
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      DEVICE: "${DEVICE:-cpu}"
      CHECKPOINT_PATH: /app/temp/latest.pth.tar
      SEARCH_SIMULATIONS: "${SEARCH_SIMULATIONS:-96}"
      COMPILE_INFERENCE: "${COMPILE_INFERENCE:-false}"
      LUNA_WEB_SECRET: "${LUNA_WEB_SECRET:?Set LUNA_WEB_SECRET in .env}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-true}"
      THREADS: "${THREADS:-4}"
      TIMEOUT: "${TIMEOUT:-180}"
      GRACEFUL_TIMEOUT: "${GRACEFUL_TIMEOUT:-30}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes:
      - ./temp:/app/temp:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
